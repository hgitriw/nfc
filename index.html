<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нажми</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
  #tap {
    position:fixed; inset:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:#111; color:#fff; font-family:sans-serif; font-size:32px;
    border:none; cursor:pointer; text-align:center; padding:20px;
  }
  #tap:active { background:#222; }
</style>
</head>
<body>
<button id="tap">▶ НАЖМИ</button>
<audio id="sound" src="ston.mp3" preload="auto"></audio>
<script>
  const btn = document.getElementById('tap');
  const audio = document.getElementById('sound');
  btn.addEventListener('click', () => {
    audio.play();
    btn.style.display = 'none';
  });
</script>
</body>
</html>
