<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ВНИМАНИЕ! ВИРУС!</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #000;
    color: #ff0000;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
  }
  .warning {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 20px;
    animation: blink 1s infinite;
  }
  .subtext {
    font-size: 16px;
    color: #fff;
    margin-bottom: 30px;
  }
  .timer {
    font-size: 80px;
    font-weight: bold;
    color: #ff0000;
    margin-bottom: 40px;
    text-shadow: 0 0 20px red;
  }
  button {
    background-color: #ff0000;
    color: white;
    border: none;
    padding: 15px 40px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    box-shadow: 0 0 15px red;
  }
  button:active {
    background-color: #990000;
  }
  @keyframes blink {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>

  <div class="warning">⚠️ ОБНАРУЖЕН ТРОЯН ⚠️</div>
  <div class="subtext">Ваше устройство заражено. Начинается активация...</div>
  <div class="timer" id="timer">60</div>
  <button id="cancel-btn">ОТМЕНИТЬ АТАКУ</button>

  <audio id="sound" src="ston.mp3" preload="auto"></audio>

  <script>
    let time = 60;
    let isPlaying = false; 
    
    const timerElement = document.getElementById('timer');
    const btn = document.getElementById('cancel-btn');
    const audio = document.getElementById('sound');

    function playPrank() {
      if (isPlaying) return; 
      isPlaying = true;
      audio.play();
      btn.style.display = 'none'; 
    }

    const countdown = setInterval(() => {
      time--;
      timerElement.innerText = time;
      if (time <= 0) {
        clearInterval(countdown); 
        timerElement.innerText = "0";
        playPrank(); 
      }
    }, 1000);

    btn.addEventListener('click', () => {
      clearInterval(countdown); 
      playPrank(); 
    });
  </script>

</body>
</html>
